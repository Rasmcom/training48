name: Fix mobile font consistency

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-font:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply consistent Arabic web font
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '  <title>منصة التدريب والنمو المهني</title>\n  <style>'
          replacement = '''  <title>منصة التدريب والنمو المهني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>'''
          if 'fonts.googleapis.com/css2?family=Noto+Sans+Arabic' not in text:
              if marker not in text:
                  raise SystemExit('HTML head marker not found')
              text = text.replace(marker, replacement, 1)
          old = '''    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:linear-gradient(180deg,#f6f8fc 0%,#eef3fb 100%);color:#16233f;font-family:"Helvetica Neue W23 for SKY","Helvetica Neue",Tahoma,Arial,sans-serif;}
    button,input,select,textarea{font:inherit}'''
          new = '''    *{box-sizing:border-box}
    html{
      scroll-behavior:smooth;
      font-family:"Noto Sans Arabic","Helvetica Neue W23 for SKY",Tahoma,Arial,sans-serif;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }
    body{margin:0;background:linear-gradient(180deg,#f6f8fc 0%,#eef3fb 100%);color:#16233f;font-family:inherit;}
    button,input,select,textarea{font-family:inherit;font-size:inherit}'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'font-family:"Noto Sans Arabic"' not in text:
              raise SystemExit('Font CSS marker not found')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit font fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Use one Arabic font on desktop and mobile"
            git push
          fi
