<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>منصة التدريب والنمو المهني</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fc}
    #app{display:block;width:100%;height:100dvh;border:0;background:#f6f8fc}
  </style>
</head>
<body>
  <iframe id="app" src="app-current.html?v=20260823-landscape" title="منصة التدريب والنمو المهني"></iframe>
  <script>
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{
      try{
        const w=frame.contentWindow;
        const d=frame.contentDocument;
        const fixed=d.createElement('style');
        fixed.id='forcedLandscapePrintRules';
        fixed.textContent=`
          @page portraitPage{size:210mm 297mm;margin:0}
          @page landscapePage{size:297mm 210mm;margin:0}
          @media print{
            html,body{margin:0!important;padding:0!important;background:#fff!important;overflow:hidden!important}
            body.printing>*:not(#printRoot){display:none!important}
            #printRoot{display:block!important;position:fixed!important;inset:0!important;z-index:2147483647!important;background:#fff!important;margin:0!important;padding:0!important}
            body.printing.portrait #printRoot,body.printing.portrait #printRoot>.print-page{width:210mm!important;min-width:210mm!important;max-width:210mm!important;height:297mm!important;min-height:297mm!important;max-height:297mm!important;margin:0!important}
            body.printing.portrait #printRoot>.print-page{page:portraitPage}
            body.printing.landscape #printRoot,body.printing.landscape #printRoot>.print-page.landscape{width:297mm!important;min-width:297mm!important;max-width:297mm!important;height:210mm!important;min-height:210mm!important;max-height:210mm!important;margin:0!important;padding:0!important;overflow:hidden!important}
            body.printing.landscape #printRoot>.print-page.landscape{page:landscapePage}
          }
        `;
        d.head.appendChild(fixed);

        w.openPrint=async function(html,orientation='portrait'){
          const root=d.getElementById('printRoot');
          root.innerHTML=html;
          d.body.classList.remove('portrait','landscape');
          d.body.classList.add('printing',orientation);

          let dynamic=d.getElementById('dynamicPrintPage');
          if(!dynamic){dynamic=d.createElement('style');dynamic.id='dynamicPrintPage';d.head.appendChild(dynamic)}
          dynamic.textContent=orientation==='landscape'
            ? '@page{size:297mm 210mm!important;margin:0!important}@media print{html,body{width:297mm!important;height:210mm!important}body.printing.landscape,#printRoot,#printRoot>.print-page.landscape{width:297mm!important;min-width:297mm!important;max-width:297mm!important;height:210mm!important;min-height:210mm!important;max-height:210mm!important;margin:0!important;padding:0!important;overflow:hidden!important}}'
            : '@page{size:210mm 297mm!important;margin:0!important}@media print{html,body{width:210mm!important;height:297mm!important}body.printing.portrait,#printRoot,#printRoot>.print-page{width:210mm!important;min-width:210mm!important;max-width:210mm!important;height:297mm!important;min-height:297mm!important;max-height:297mm!important;margin:0!important}}';

          const images=[...root.querySelectorAll('img')];
          await Promise.all(images.map(img=>new Promise(resolve=>{
            if(img.complete&&img.naturalWidth>0){if(img.decode){img.decode().then(resolve).catch(resolve)}else resolve();return}
            const finish=()=>resolve();
            img.addEventListener('load',finish,{once:true});
            img.addEventListener('error',finish,{once:true});
            setTimeout(finish,1500);
          })));
          if(d.fonts&&d.fonts.ready){try{await d.fonts.ready}catch(e){}}
          await new Promise(r=>w.requestAnimationFrame(()=>w.requestAnimationFrame(r)));
          await new Promise(r=>setTimeout(r,250));

          const done=()=>{d.body.classList.remove('printing','portrait','landscape');root.innerHTML='';w.removeEventListener('afterprint',done)};
          w.addEventListener('afterprint',done);
          w.print();
        };
      }catch(e){console.error('print patch failed',e)}
    });
  </script>
</body>
</html>
