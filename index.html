<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>منصة التدريب والنمو المهني</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fc}
    #app{display:block;width:100%;height:100%;border:0;background:#f6f8fc}
  </style>
</head>
<body>
  <iframe id="app" src="app.html?v=20260821-fontfix" title="منصة التدريب والنمو المهني"></iframe>
  <script>
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        const pre1=doc.createElement('link');
        pre1.rel='preconnect'; pre1.href='https://fonts.googleapis.com';
        const pre2=doc.createElement('link');
        pre2.rel='preconnect'; pre2.href='https://fonts.gstatic.com'; pre2.crossOrigin='anonymous';
        const font=doc.createElement('link');
        font.rel='stylesheet';
        font.href='https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800;900&display=swap';
        const style=doc.createElement('style');
        style.textContent='html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body,button,input,select,textarea{font-family:"Noto Sans Arabic",Tahoma,Arial,sans-serif!important}';
        doc.head.append(pre1,pre2,font,style);
      }catch(e){console.error(e)}
    });
  </script>
</body>
</html>
